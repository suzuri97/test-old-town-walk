<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>附近散策</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7a4b32">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* ---- 基本設定 ---- */
    body {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      background-color: #f2e8d5;
      color: #3b2e22;
    }

    /* ---- 頁首 ---- */
    header {
      background-color: #7a4b32;
      color: #f2e8d5;
      text-align: center;
      padding: 32px 16px;
    }
    header h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      letter-spacing: 4px;
    }
    header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.85;
    }

    /* ---- 景點卡片 ---- */
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
    .landmark {
      background-color: #fffaf0;
      border: 1px solid #d8c4a0;
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .landmark img {
      width: 100%;
      display: block;
    }
    .landmark h2 {
      font-size: 18px;
      margin: 12px 16px 4px 16px;
    }
    .landmark p {
      font-size: 14px;
      line-height: 1.6;
      margin: 0 16px 16px 16px;
      color: #5c4b3a;
    }

    /* ---- 完成獎勵畫面 ---- */
    .reward-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(59, 46, 34, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .reward-card {
      background-color: #fffaf0;
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
      max-width: 320px;
    }
    .reward-badge {
      font-size: 48px;
      margin: 0 0 8px 0;
    }
    .reward-card h2 {
      margin: 0 0 12px 0;
      color: #7a4b32;
    }
    .reward-card p {
      font-size: 14px;
      line-height: 1.6;
      color: #5c4b3a;
    }
    #reward-close-btn {
      margin-top: 16px;
      padding: 10px 24px;
      background-color: #7a4b32;
      color: #f2e8d5;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }

    /* ---- 古今對比滑桿 ---- */
    .compare-wrap {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
    }
    .compare-old,
    .compare-new {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .compare-new {
      clip-path: inset(0 50% 0 0);
    }
    .compare-slider {
      position: absolute;
      bottom: 10px;
      left: 8px;
      width: calc(100% - 16px);
      z-index: 2;
    }

    /* ---- 路線地圖 ---- */
    #route-map {
      width: 100%;
      height: 260px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #d8c4a0;
    }

    /* ---- 定位按鈕 ---- */
    .locate-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 0 auto 20px auto;
      padding: 12px;
      background-color: #3b2e22;
      color: #f2e8d5;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
    }
    .distance {
      font-size: 13px;
      margin: 0 16px 12px 16px !important;
      color: #9a6b3f !important;
      font-weight: bold;
    }
    .stamp-btn:disabled {
      background-color: #cbbfa8;
      cursor: not-allowed;
    }

    /* ---- 打卡按鈕 ---- */
    .stamp-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 0 16px 16px 16px;
      padding: 10px;
      background-color: #7a4b32;
      color: #f2e8d5;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
    .stamp-btn.collected {
      background-color: #a3b18a;
      cursor: default;
    }

    /* ---- 頁尾 ---- */
    footer {
      text-align: center;
      padding: 16px;
      font-size: 14px;
      color: #7a4b32;
    }
  </style>
</head>
<body>

  <header>
    <h1>附近散策</h1>
    <p>走進街巷，測試能否順利遇見過去</p>
  </header>

  <main id="landmark-list">
    <div id="route-map"></div>
    <button id="locate-btn" class="locate-btn">📍 更新我的位置</button>
    <!-- 景點卡片會由 JavaScript 自動產生在這裡 -->
  </main>

  <footer>
    <p>已收集章：<span id="stamp-count">0</span> / <span id="total-count">0</span></p>
  </footer>

  <!-- 完成獎勵畫面：平常隱藏，全部集滿章才顯示 -->
  <div id="reward-screen" class="reward-overlay" style="display: none;">
    <div class="reward-card">
      <p class="reward-badge">🏅</p>
      <h2>散策完成！</h2>
      <p>你已經走完老城區所有景點，親眼見證了古今交錯的風景。</p>
      <button id="reward-close-btn">收起</button>
    </div>
  </div>

  <script>
    // ---- 資料：所有景點都放在這個陣列裡 ----
    // 想新增景點，只要在這裡多加一個 { } 物件就好，不用碰 HTML
    const landmarks = [
      {
        id: 1,
        name: "金樽餐廳",
        newImage: "image-金樽",
        oldImage: "https://placehold.co/400x250/8a7048/f2e8d5?text=%E8%80%81%E7%85%A7%E7%89%87",
        description: "公會聚餐、婚宴會館。",
        lat: 24.75034,
        lng: 121.77478
      },
      {
        id: 2,
        name: "7-11壯五門市",
        newImage: "image-小七壯五",
        oldImage: "https://placehold.co/400x250/8a7048/f2e8d5?text=%E8%80%81%E7%85%A7%E7%89%87",
        description: "大家的方便的小七。",
        lat: 24.74814,
        lng: 121.78160
      },
      {
        id: 3,
        name: "喜互惠壯圍店",
        newImage: "image-喜互惠",
        oldImage: "https://placehold.co/400x250/8a7048/f2e8d5?text=%E8%80%81%E7%85%A7%E7%89%87",
        description: "宜蘭特有，購物袋的圖案很有趣。",
        lat: 24.74705, 
        lng: 121.784850
      }
    ];

    // ---- 初始化路線地圖 ----
    // 用所有景點座標的平均值，決定地圖一開始要顯示哪個中心點
    const avgLat =
      landmarks.reduce(function (sum, l) { return sum + l.lat; }, 0) / landmarks.length;
    const avgLng =
      landmarks.reduce(function (sum, l) { return sum + l.lng; }, 0) / landmarks.length;

    const map = L.map("route-map").setView([avgLat, avgLng], 16);

    // 加入地圖底圖（OpenStreetMap，免費開源）
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // 幫每個景點加上標記(Marker)，點下去會顯示名稱
    landmarks.forEach(function (landmark) {
      L.marker([landmark.lat, landmark.lng])
        .addTo(map)
        .bindPopup(landmark.name);
    });

    // 畫一條線，依照景點在陣列裡的順序連起來，代表建議路線
    const routeCoords = landmarks.map(function (landmark) {
      return [landmark.lat, landmark.lng];
    });
    L.polyline(routeCoords, { color: "#7a4b32", weight: 4, dashArray: "6 8" }).addTo(map);

    // ---- LocalStorage：讀取與寫入「已收集景點」清單 ----
    const STORAGE_KEY = "collectedStamps";

    function loadCollectedIds() {
      const saved = localStorage.getItem(STORAGE_KEY);
      // 如果之前沒存過任何資料，回傳空陣列
      return saved ? JSON.parse(saved) : [];
    }

    function saveCollectedIds(idsArray) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(idsArray));
    }

    // 記住目前收集了幾個章
    let collectedIds = loadCollectedIds();
    let stampCount = collectedIds.length;
    const totalStamps = landmarks.length;
    document.getElementById("total-count").textContent = totalStamps;
    document.getElementById("stamp-count").textContent = stampCount;

    // 找到要放景點卡片的容器
    const listContainer = document.getElementById("landmark-list");

    // 走訪陣列裡的每一筆景點資料，把它變成一段 HTML 加進容器裡
    landmarks.forEach(function (landmark) {
      const section = document.createElement("section");
      section.className = "landmark";
      section.dataset.id = landmark.id;

      section.innerHTML = `
        <div class="compare-wrap">
          <img class="compare-old" src="${landmark.oldImage}" alt="${landmark.name}舊照片">
          <img class="compare-new" src="${landmark.newImage}" alt="${landmark.name}現今照片">
          <input type="range" class="compare-slider" min="0" max="100" value="50">
        </div>
        <h2>${landmark.name}</h2>
        <p>${landmark.description}</p>
        <p class="distance">尚未定位</p>
        <button class="stamp-btn" disabled>標記已抵達</button>
      `;

      listContainer.appendChild(section);

      // 如果這個景點之前就收集過了，一開始就顯示成「已收集」狀態
      if (collectedIds.includes(landmark.id)) {
        const btn = section.querySelector(".stamp-btn");
        btn.classList.add("collected");
        btn.disabled = true;
        btn.textContent = "已收集 ✓";
      }
    });

    // ---- 古今對比滑桿：拖動時即時調整新照片的裁切範圍 ----
    document.querySelectorAll(".compare-slider").forEach(function (slider) {
      slider.addEventListener("input", function () {
        const wrap = slider.closest(".compare-wrap");
        const newImg = wrap.querySelector(".compare-new");
        // 滑桿值 0~100，決定「新照片」從左邊露出多少
        const revealPercent = slider.value;
        const hiddenPercent = 100 - revealPercent;
        newImg.style.clipPath = "inset(0 " + hiddenPercent + "% 0 0)";
      });
    });

    // 找到所有「標記已抵達」按鈕（此時卡片都已經產生出來了）
    const buttons = document.querySelectorAll(".stamp-btn");

    buttons.forEach(function (button) {
      button.addEventListener("click", function () {
        if (button.classList.contains("collected")) {
          return;
        }
        button.classList.add("collected");
        button.disabled = true;
        button.textContent = "已收集 ✓";

        stampCount = stampCount + 1;
        document.getElementById("stamp-count").textContent = stampCount;

        // 把這個景點的 id 加進已收集清單，並存進 localStorage
        const id = Number(button.closest(".landmark").dataset.id);
        collectedIds.push(id);
        saveCollectedIds(collectedIds);

        if (stampCount === totalStamps) {
          showRewardScreen();
        }
      });
    });

    // ---- 計算兩個座標點之間的距離（公尺）----
    // 這是「哈弗賽公式」，地球是球體，不能直接用兩點間的直線距離公式
    function calculateDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000; // 地球半徑（公尺）
      const toRad = (deg) => (deg * Math.PI) / 180;

      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);

      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) *
          Math.cos(toRad(lat2)) *
          Math.sin(dLng / 2) *
          Math.sin(dLng / 2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c; // 回傳公尺數
    }

    // 多近才算「已抵達」（公尺）
    const ARRIVAL_THRESHOLD = 20;

    // ---- 「更新我的位置」按鈕 ----
    document.getElementById("locate-btn").addEventListener("click", function () {
      // 瀏覽器沒有定位功能（極少見，通常都支援）
      if (!navigator.geolocation) {
        alert("這個瀏覽器不支援定位功能");
        return;
      }

      // 跟瀏覽器要求使用者目前的座標
      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 成功取得位置後會執行這裡
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          // 走訪每一張卡片，更新距離顯示、決定按鈕是否解鎖
          // 同時把每張卡片跟它的距離存進陣列，等一下要用來排序
          const sectionsWithDistance = [];

          document.querySelectorAll(".landmark").forEach(function (section) {
            const id = Number(section.dataset.id);
            const landmark = landmarks.find(function (item) {
              return item.id === id;
            });

            const distance = calculateDistance(
              userLat,
              userLng,
              landmark.lat,
              landmark.lng
            );

            const distanceText = section.querySelector(".distance");
            const stampButton = section.querySelector(".stamp-btn");

            distanceText.textContent =
              "距離：約 " + Math.round(distance) + " 公尺";

            // 如果夠近，而且還沒收集過，就解鎖按鈕
            if (
              distance <= ARRIVAL_THRESHOLD &&
              !stampButton.classList.contains("collected")
            ) {
              stampButton.disabled = false;
            }

            sectionsWithDistance.push({ section: section, distance: distance });
          });

          // ---- 依距離由近到遠排序 ----
          sectionsWithDistance.sort(function (a, b) {
            return a.distance - b.distance;
          });

          // appendChild 用在「已經存在於畫面上」的元素時，
          // 效果不是新增一份，而是把它「移動」到容器的最後面
          // 所以依排序後的順序依序呼叫，就能讓卡片重新排列
          sectionsWithDistance.forEach(function (item) {
            listContainer.appendChild(item.section);
          });
        },
        function (error) {
          // 取得位置失敗時執行這裡（例如使用者拒絕權限）
          alert("無法取得你的位置，請確認已允許定位權限");
        }
      );
    });

    // ---- 完成獎勵畫面：顯示與關閉 ----
    function showRewardScreen() {
      document.getElementById("reward-screen").style.display = "flex";
    }

    document.getElementById("reward-close-btn").addEventListener("click", function () {
      document.getElementById("reward-screen").style.display = "none";
    });

    // ---- 註冊 Service Worker ----
    // 要注意：navigator.serviceWorker 只能在 HTTPS 或 localhost 環境下運作
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("sw.js")
        .then(function () {
          console.log("Service Worker 註冊成功");
        })
        .catch(function (error) {
          console.log("Service Worker 註冊失敗：", error);
        });
    }
  </script>

</body>
</html>
